server {
    listen 80;
    server_name localhost;

    # Serve the Vite dist bundle
    root /usr/share/nginx/html;
    index index.html;

    # ── Performance: gzip compression ─────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json application/xml
               image/svg+xml;

    # ── API Proxy — forwards /api/* to the FastAPI backend ──────────────────
    # Uses the docker-compose service name "backend" as the upstream host
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Keep connections alive for lower per-request overhead
        proxy_set_header   Connection "";

        # Timeouts — generous for demo stability
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;

        # CORS is handled in FastAPI; do not duplicate headers here
    }

    # ── Static asset caching (JS/CSS chunks fingerprinted by Vite) ───────────
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── SPA fallback — all unknown paths serve index.html ────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy       "no-referrer"  always;
}
